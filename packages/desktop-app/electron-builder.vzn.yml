# Internal VZN builds are unsigned and have no update publisher.
extends: null
appId: care.vzn.code
productName: VZN Code

extraMetadata:
  name: vzn-code
  productName: VZN Code
  description: VZN Code desktop app
  author: VZN Care

directories:
  buildResources: build
  output: dist-vzn

files:
  - out/**
  - "!node_modules/**"
  - node_modules/node-pty/**
  - node_modules/electron-log/**
  - node_modules/@agent-native/core/package.json
  - node_modules/@agent-native/core/dist/**
  - node_modules/ws/**
  - "!src/**"
  - "!shared/**"
  - "!electron.vite.config.*"
  - "!{.env,.env.*,.npmrc,pnpm-lock.yaml}"
  - "!{tsconfig.json,tsconfig.*.json}"

asarUnpack:
  - node_modules/node-pty/prebuilds/**

extraResources:
  - from: ../agent-chrome-extension/dist
    to: chrome-extension

protocols:
  - name: VZN Code
    schemes:
      - vzncode

mac:
  files:
    - "!node_modules/node-pty/build/**"
  extraResources:
    - from: native/bin/agent-native-computer-helper
      to: native/agent-native-computer-helper
    - from: build/Assets.car
      to: Assets.car
  category: public.app-category.developer-tools
  identity: null
  icon: build/icon.icns
  extendInfo:
    CFBundleIconName: agent-native
    NSMicrophoneUsageDescription: VZN Code uses your microphone for dictation and realtime voice conversations.
    NSCameraUsageDescription: VZN Code uses your camera for video capture in apps like Clips.
    NSScreenCaptureUsageDescription: VZN Code records your screen when you start a recording in apps like Clips.
  entitlements: entitlements.mac.plist
  entitlementsInherit: entitlements.mac.plist
  notarize: false
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64

dmg:
  artifactName: ${productName}-${arch}.${ext}

win:
  signAndEditExecutable: false
  files:
    - "!node_modules/node-pty/build/**"
  icon: build/icon.png
  target:
    - target: nsis
      arch:
        - x64
        - arm64
  artifactName: ${productName}-${arch}.${ext}

nsis:
  oneClick: true
  perMachine: false

linux:
  executableName: vzn-code
  icon: build/icon.png
  target:
    - target: tar.xz
      arch:
        - x64
        - arm64
    - target: AppImage
      arch:
        - x64
        - arm64
    - target: deb
      arch:
        - x64
        - arm64
  category: Development
  artifactName: ${productName}-${arch}.${ext}

publish: null

npmRebuild: false
